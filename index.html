<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which Mic Should You Buy? — Free Picker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0f1115; color: #e8eaf0; min-height: 100vh; display: flex;
         justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 560px; background: #171a21; border: 1px solid #2a2e3a;
          border-radius: 14px; padding: 28px 24px; margin: auto 0; }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .sub { color: #9aa0b2; font-size: .95rem; margin-bottom: 20px; line-height: 1.5; }
  .progress { height: 6px; background: #262b38; border-radius: 3px; margin-bottom: 22px; overflow: hidden; }
  .progress > div { height: 100%; background: #4f8cff; border-radius: 3px; transition: width .3s; }
  .q { font-size: 1.15rem; font-weight: 600; margin-bottom: 14px; }
  .opt { display: block; width: 100%; text-align: left; background: #1f2330; color: #e8eaf0;
         border: 1px solid #343a4d; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
         font-size: 1rem; cursor: pointer; transition: border-color .15s, background .15s; }
  .opt:hover { border-color: #4f8cff; background: #232938; }
  .back { background: none; border: none; color: #7d8496; font-size: .85rem; cursor: pointer; margin-top: 6px; }
  .pick { font-size: 1.35rem; font-weight: 700; color: #4f8cff; margin: 6px 0 4px; }
  .price { font-size: 1.05rem; color: #c9cfdd; margin-bottom: 14px; }
  .why { line-height: 1.6; color: #d6dae6; margin-bottom: 14px; }
  .caveat { background: #221a12; border: 1px solid #5a4020; border-radius: 10px; padding: 12px 14px;
            font-size: .92rem; line-height: 1.55; color: #e8d9bd; margin-bottom: 18px; }
  .cta { display: block; text-align: center; background: #4f8cff; color: #fff; text-decoration: none;
         font-weight: 700; border-radius: 10px; padding: 14px; margin-bottom: 10px; font-size: 1.05rem; }
  .cta.alt { background: #232a3a; border: 1px solid #4f8cff; color: #bcd2ff; }
  .ftc { margin-top: 18px; font-size: .78rem; color: #6b7183; line-height: 1.5; }
  .restart { display: block; margin: 14px auto 0; background: none; border: none; color: #7d8496;
             cursor: pointer; font-size: .9rem; text-decoration: underline; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
// ============================================================
// MIC PICKER QUIZ
// To wire real affiliate links: find the lines marked
//   PASTE AFFILIATE LINK HERE
// and replace the "#" in each href with your real URL.
// ============================================================

var PICKS = {
  q2u: {
    name: "Samson Q2U",
    price: "around $70",
    why: "For a first channel, this is the smart money. It is a dynamic mic, so it forgives a bad room. It plugs in by USB today, and it also has an XLR connection — so when you upgrade later, you do not have to throw it away. Spend the rest on videos, not gear.",
    caveat: "Do not buy this if your channel is already earning and you know you will record for years — you will outgrow it, and the Shure SM7dB is the buy-once answer.",
    link: "https://link.amazon/B08hbnDWT", // PASTE AFFILIATE LINK HERE (Samson Q2U)
    fallback: "mv7"
  },
  mv7: {
    name: "Shure MV7+",
    price: "around $300",
    why: "This is the pick I would give a friend who said, \"I just want to plug something in and sound like a real channel.\" USB and XLR, dynamic, and its app lets you shape the sound without knowing anything about audio. Simple, but genuinely good.",
    caveat: "Do not buy this if money is tight — the Samson Q2U at ~$70 gets you 80% of the way there. And do not buy it if you are already earning: the SM7dB is the end of the road.",
    link: "https://link.amazon/B0bpCPHco", // PASTE AFFILIATE LINK HERE (Shure MV7+)
    fallback: "q2u"
  },
  sm7db: {
    name: "Shure SM7dB + Focusrite Scarlett Solo interface",
    price: "around $600 together",
    why: "This is the mic you hear on huge channels and podcasts for a reason, and you will never need to replace it. The built-in preamp in the SM7dB means the Scarlett Solo drives it cleanly. Buy it when the channel is earning, not before.",
    caveat: "Do not buy this with ten subscribers. This is not beginner money — and if your room is untreated, fix the room before you spend $600 on a mic.",
    link: "https://link.amazon/B0fGj4YaT", // PASTE AFFILIATE LINK HERE (Shure SM7dB)
    fallback: "mv7"
  }
};

// Each option adds points to q2u / mv7 / sm7db. Budget caps keep it honest:
// a $70 budget never gets recommended a $300 mic.
var QUESTIONS = [
  { q: "What is your budget for the mic?",
    opts: [
      { t: "Under $100 — every dollar counts", s: { q2u: 3, mv7: 0, sm7db: 0 }, cap: "q2u" },
      { t: "$100 to $300",                  s: { q2u: 1, mv7: 3, sm7db: 0 }, cap: null },
      { t: "$300+ — my channel is earning", s: { q2u: 0, mv7: 1, sm7db: 3 }, cap: null }
    ] },
  { q: "Where do you record?",
    opts: [
      { t: "Untreated bedroom or living room — echoey", s: { q2u: 1, mv7: 2, sm7db: 1 } },
      { t: "Some soft furnishings, not bad",            s: { q2u: 1, mv7: 1, sm7db: 1 } },
      { t: "Treated room, or very quiet",               s: { q2u: 0, mv7: 1, sm7db: 2 } }
    ] },
  { q: "How do you want to plug it in?",
    opts: [
      { t: "USB, straight into the computer — keep it simple", s: { q2u: 1, mv7: 2, sm7db: 0 } },
      { t: "USB now, but I want an XLR upgrade path later",    s: { q2u: 2, mv7: 1, sm7db: 0 } },
      { t: "I have (or will buy) an audio interface",          s: { q2u: 0, mv7: 0, sm7db: 3 } }
    ] },
  { q: "Where is your channel right now?",
    opts: [
      { t: "Just starting out",                 s: { q2u: 3, mv7: 0, sm7db: 0 } },
      { t: "Growing steadily",                  s: { q2u: 0, mv7: 2, sm7db: 1 } },
      { t: "Earning — buy once, cry once",      s: { q2u: 0, mv7: 0, sm7db: 3 } }
    ] },
  { q: "How noisy is your recording space?",
    opts: [
      { t: "Quiet",                                s: { q2u: 1, mv7: 1, sm7db: 1 } },
      { t: "Some noise — fridge, dog, traffic",    s: { q2u: 2, mv7: 2, sm7db: 1 } },
      { t: "Loud — I need maximum rejection",     s: { q2u: 1, mv7: 2, sm7db: 2 } }
    ] }
];

var app = document.getElementById("app");
var step = 0, answers = [], cap = null;

function render() {
  if (step === 0 && answers.length === 0) {
    app.innerHTML =
      "<h1>Which mic should you buy?</h1>" +
      "<p class='sub'>Answer 5 quick questions and get one clear pick — " +
      "not a list of twenty. Built from the same honest rules as the video: " +
      "your room decides more than your budget does.</p>" +
      "<button class='cta' onclick='next()'>Start the quiz</button>";
    return;
  }
  if (step >= QUESTIONS.length) { renderResult(); return; }
  var q = QUESTIONS[step];
  var html = "<div class='progress'><div style='width:" + (step / QUESTIONS.length * 100) + "%'></div></div>" +
             "<p class='q'>" + (step + 1) + ". " + q.q + "</p>";
  q.opts.forEach(function (o, i) {
    html += "<button class='opt' onclick='answer(" + i + ")'>" + o.t + "</button>";
  });
  if (step > 0) html += "<button class='back' onclick='back()'>&larr; back</button>";
  app.innerHTML = html;
}

function answer(i) {
  var o = QUESTIONS[step].opts[i];
  answers[step] = o;
  if (o.cap) cap = o.cap;
  step++;
  render();
}
function back() { step--; render(); }
function next() { step = 0; render(); }

function renderResult() {
  var scores = { q2u: 0, mv7: 0, sm7db: 0 };
  answers.forEach(function (o) {
    for (var k in o.s) scores[k] += o.s[k];
  });
  var order = ["q2u", "mv7", "sm7db"]; // tie-break toward the cheaper honest pick
  var best = order[0];
  order.forEach(function (k) { if (scores[k] > scores[best]) best = k; });
  if (cap === "q2u") best = "q2u"; // never recommend above the stated budget
  if (cap === null && best === "sm7db" && answers[0] && answers[0].cap === null) {
    // mid-budget ($100–300) can't stretch to the $600 SM7dB combo
    if (answers[0].t.charAt(0) === "$") best = "mv7";
  }
  var p = PICKS[best], fb = PICKS[p.fallback];
  app.innerHTML =
    "<div class='progress'><div style='width:100%'></div></div>" +
    "<p class='sub'>Your pick:</p>" +
    "<p class='pick'>" + p.name + "</p>" +
    "<p class='price'>" + p.price + "</p>" +
    "<p class='why'>" + p.why + "</p>" +
    "<div class='caveat'><strong>Honest caveat:</strong> " + p.caveat + "</div>" +
    "<a class='cta' href='" + p.link + "' target='_blank' rel='nofollow sponsored noopener'>Check the price</a>" +
    "<a class='cta alt' href='" + fb.link + "' target='_blank' rel='nofollow sponsored noopener'>Cheaper fallback: " + fb.name + " (" + fb.price + ")</a>" +
    "<p class='ftc'>Disclosure: the links above may be affiliate links. If you buy through one, " +
    "the creator may earn a commission at no extra cost to you.</p>" +
    "<button class='restart' onclick='step=0;answers=[];cap=null;render()'>Retake the quiz</button>";
}

render();
</script>
</body>
</html>
